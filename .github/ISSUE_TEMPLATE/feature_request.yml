name: Feature request
description: Suggest a change to the skill, the workbench script, or packaging.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What you were trying to do with a swarm, and what got in the way.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: What you would change. If it touches money, credentials or worker safety, say how it stays safe.
